<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Ghasel — a laundry marketplace connecting customers with nearby laundries." />
  <meta name="theme-color" content="#1d1c1a" />
  <title>Ghasel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <div id="auth-root"></div>

  <div id="app-root" class="shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#/"><span class="brand-mark">غ</span>Ghasel</a>
      <nav id="sidebar-nav" class="nav" aria-label="Main"></nav>
      <div class="sidebar-footer">
        <div class="identity">
          <span id="identity-avatar" class="avatar"></span>
          <div><strong id="identity-name"></strong><span id="identity-role"></span></div>
        </div>
        <button id="sign-out" class="nav-link signout" type="button"></button>
      </div>
    </aside>

    <header class="topbar">
      <a class="brand" href="#/"><span class="brand-mark">غ</span>Ghasel</a>
      <a id="topbar-profile" class="avatar" href="#/profile" aria-label="Your account"></a>
    </header>

    <main id="page-root" class="main"></main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Main"></nav>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" class="toast-region" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
