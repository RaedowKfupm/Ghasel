[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
filterwarnings =
    # Upstream FastAPI/Starlette pins still call asyncio.iscoroutinefunction on Python 3.14.
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning
    # Alembic notes that generated (Computed) columns cannot be altered; expected for our geography columns.
    ignore:Computed default on:UserWarning
